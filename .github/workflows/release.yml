name: Executables de release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: win
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
          - runner: macos-15-intel
            platform: mac
            arch: x64
          - runner: macos-15
            platform: mac
            arch: arm64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Verifier la version du tag
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node -e "const v=require('./package.json').version; if(process.env.RELEASE_TAG!=='v'+v)throw new Error('Le tag doit correspondre a package.json : v'+v)"
      - run: npm ci
      - run: npm test
      - name: Construire les installateurs
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
  publish:
    name: Joindre les installateurs a la release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Checksums et publication
        working-directory: installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          sha256sum * > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" * --clobber
